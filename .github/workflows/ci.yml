name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  package:
    name: Package and Demo
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version
          swift package tools-version

      - name: Check release hygiene
        run: Scripts/check-release-hygiene.sh

      - name: Validate quality fixture catalog
        run: |
          python3 Scripts/fetch-benchmark-fixtures.py --check
          python3 -m unittest discover -s Scripts/Tests -p 'test_*.py'

      - name: Test package
        run: swift test

      - name: Build package for release
        run: swift build -c release

      - name: Test Demo package
        run: swift test --package-path Examples/PosterFrameDemo

      - name: Build Demo package for release
        run: swift build -c release --package-path Examples/PosterFrameDemo

  apple-platforms:
    name: Apple Platforms and DocC
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build for macOS
        run: |
          xcodebuild build -quiet \
            -scheme PosterFrameKit \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/PosterFrameKit-macOS" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build for iOS
        run: |
          xcodebuild build -quiet \
            -scheme PosterFrameKit \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/PosterFrameKit-iOS" \
            CODE_SIGNING_ALLOWED=NO

      - name: Test iOS consumer example
        run: |
          IOS_SIMULATOR_ID="$(
            xcrun simctl list devices available --json |
              jq -r '[.devices[][] | select(.isAvailable and (.name | startswith("iPhone")))] | first | .udid'
          )"
          if [[ -z "$IOS_SIMULATOR_ID" || "$IOS_SIMULATOR_ID" == "null" ]]; then
            echo "No available iPhone Simulator was found." >&2
            exit 1
          fi
          xcodebuild test -quiet \
            -project Examples/PosterFrameIOSExample/PosterFrameIOSExample.xcodeproj \
            -scheme PosterFrameIOSExample \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/PosterFrameKit-iOS-Example"

      - name: Build for tvOS
        run: |
          xcodebuild build -quiet \
            -scheme PosterFrameKit \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath "$RUNNER_TEMP/PosterFrameKit-tvOS" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build for visionOS
        run: |
          xcodebuild build -quiet \
            -scheme PosterFrameKit \
            -destination 'generic/platform=visionOS' \
            -derivedDataPath "$RUNNER_TEMP/PosterFrameKit-visionOS" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build DocC archive
        run: Scripts/build-documentation.sh
